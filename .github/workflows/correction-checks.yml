name: Validate correction ledger

on:
  pull_request:
    paths:
      - 'corrections/**'
      - 'scripts/corrections.py'
      - 'scripts/test_corrections.py'
      - 'scripts/build_explorer.py'
      - 'scripts/analysis_cohort.py'
      - 'stats_analysis.py'
      - 'tests/**'
      - 'assets/explorer/**'
      - 'explorer.html'
      - '.github/ISSUE_TEMPLATE/correction.md'
      - '.github/workflows/correction-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_corrections.py'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/explorer-behavior.test.cjs
      - run: python3 scripts/corrections.py validate
      - run: python3 scripts/build_explorer.py --check
