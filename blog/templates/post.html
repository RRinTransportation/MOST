<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>{{ title }} - MOST Blog</title>
  <link rel="stylesheet" href="https://www.rerite.org/MOST/mostyles.css">
  <!-- RERITE_SHARED_STYLES:START -->
  <link rel="stylesheet" href="../assets/rerite/rerite-base.css">
  <link rel="stylesheet" href="../assets/rerite/rerite-navbar.css">
  <!-- RERITE_SHARED_STYLES:END -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
  </script>
  <style>
    /* Add some basic blog styles */
    .blog-post {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .blog-meta {
      color: #666;
      margin-bottom: 2rem;
    }
    .blog-content {
      line-height: 1.6;
      font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    }
    .blog-content h1, .blog-content h2, .blog-content h3 {
      margin-top: 1.5rem;
    }
    .blog-content p {
        margin-bottom: 1rem;
    }
    .back-link {
        display: inline-block;
        margin-bottom: 1rem;
        text-decoration: none;
        color: var(--primary-color);
    }
    .blog-content table {
      width: 100%;
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.95rem;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
    .blog-content th, .blog-content td {
      padding: 0.55rem 1rem;
      border-bottom: 1px solid #e8e8e8;
      text-align: left;
      white-space: nowrap;
    }
    .blog-content thead th {
      background-color: #f7f7f7;
      font-weight: 600;
      border-bottom: 2px solid #d8d8d8;
    }
    .blog-content tbody tr:nth-child(even) {
      background-color: #fafafa;
    }
    .blog-content tbody tr:last-child td {
      border-bottom: none;
    }
    .blog-content table code {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<!-- RERITE_SHARED_NAV:START -->
<nav class="navbar">
  <div class="container">
    <a class="navbar-brand" href="/index.html" aria-label="RERITE home">
      <span class="navbar-brand-mark logo-signal--animate">
        <img src="/images/logo_png.png" width="2115" height="606" alt="" />
        <span class="logo-signal-light logo-signal-light--red" aria-hidden="true"></span>
        <span class="logo-signal-light logo-signal-light--amber" aria-hidden="true"></span>
        <span class="logo-signal-light logo-signal-light--green" aria-hidden="true"></span>
      </span>
    </a>
    <button class="navbar-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-navigation">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <ul class="navbar-nav" id="primary-navigation">
      <li><a class="nav-link" href="/index.html">Home</a></li>
      <li><a class="nav-link" href="/about.html">About</a></li>
      <li><a class="nav-link" href="/team.html">Team</a></li>
      <li><a class="nav-link" href="/activities.html">Activities</a></li>
      <li><a class="nav-link" href="/newsletter.html">Newsletter</a></li>
      <li class="nav-item dropdown">
        <button class="nav-link dropdown-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="resources-menu">Resources</button>
        <div class="dropdown-menu" id="resources-menu">
          <div class="dropdown-container">
            <p class="dropdown-section-label">Collections</p>
            <a class="dropdown-item" href="/awesome-rerite.html">Open datasets and tools</a>
            <a class="dropdown-item" href="/MOST/">Open science explorer</a>
            <a class="dropdown-item" href="/itsc24-rr-tutorial/">Tutorial (2024)</a>
          </div>
        </div>
      </li>
      <li><a class="nav-link" href="/getinvolved.html">Get Involved</a></li>
      <li><a class="nav-link" href="https://groups.google.com/g/rerite/">Subscribe</a></li>
    </ul>
  </div>
</nav>

<script>
  (function() {
    const navbar = document.querySelector('.navbar');
    const toggle = navbar?.querySelector('.navbar-toggle');
    const navList = navbar?.querySelector('.navbar-nav');
    const dropdown = navbar?.querySelector('.dropdown');
    const dropdownToggle = navbar?.querySelector('.dropdown-toggle');
    const mobileBreakpoint = 992;

    if (!navbar || !toggle || !navList) {
      return;
    }

    const closeDropdown = () => {
      dropdown?.classList.remove('dropdown--open');
      dropdownToggle?.setAttribute('aria-expanded', 'false');
    };

    const closeMenu = (restoreFocus = false) => {
      navbar.classList.remove('navbar--open');
      toggle.setAttribute('aria-expanded', 'false');
      closeDropdown();

      if (restoreFocus) {
        toggle.focus();
      }
    };

    toggle.addEventListener('click', (event) => {
      event.stopPropagation();
      const isOpen = navbar.classList.toggle('navbar--open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      if (!isOpen) {
        closeDropdown();
      }
    });

    dropdownToggle?.addEventListener('click', (event) => {
      event.stopPropagation();
      const isOpen = dropdown.classList.toggle('dropdown--open');
      dropdownToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    document.addEventListener('click', (event) => {
      if (!navbar.contains(event.target)) {
        closeMenu();
      }
    });

    navList.addEventListener('click', (event) => {
      if (event.target.closest('a')) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && navbar.classList.contains('navbar--open')) {
        closeMenu(true);
      } else if (event.key === 'Escape' && dropdown?.classList.contains('dropdown--open')) {
        closeDropdown();
        dropdownToggle?.focus();
      }
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > mobileBreakpoint) {
        closeMenu();
      }
    });
  })();
</script>
<!-- RERITE_SHARED_NAV:END -->

<div class="content-container">
    <main>
        <article class="blog-post">
            <a href="index.html" class="back-link">&larr; Back to Blog</a>
            <header>
                <h1>{{ title }}</h1>
                <div class="blog-meta">
                    <span>{{ date }}</span> | <span>{{ author }}</span>
                </div>
            </header>
            <div class="blog-content">
                {{ content | safe }}
            </div>
        </article>
    </main>
    
    <footer>
        <div class="container">
          <div class="footer-bottom">
            <p>&copy; 2024 - 2026 <a href="../index.html">MOST Project</a>. All rights reserved.</p>
          </div>
        </div>
    </footer>
</div>

</body>
</html>
